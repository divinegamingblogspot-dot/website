<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurelia | Returns & RMA</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><a class="logo" href="index.html"><span>A</span><div>Aurelia<small>WOMEN'S ACCESSORIES</small></div></a><nav><a href="index.html#shop">Shop</a><a href="cart.html">Cart</a><a href="account.html">Account</a></nav></header><main class="pageWrap narrow"><p class="eyebrow">RMA CENTRE</p><h1>Return / warranty request</h1><form id="rma" class="checkoutForm"><div class="formGrid"><label>Order ID<input required></label><label>SKU<input required></label><label>Reason<select><option>Defective</option><option>Wrong product</option><option>Damaged</option><option>Missing item</option><option>Warranty</option></select></label><label>Serial number<input></label><label class="full">Details<textarea rows="4"></textarea></label></div><button class="primary">Submit RMA →</button></form><div id="rmaDone"></div></main><script>document.getElementById("rma").onsubmit=e=>{e.preventDefault();const ref="RMA"+Date.now().toString().slice(-7);localStorage.setItem("mb-last-rma",ref);document.getElementById("rmaDone").innerHTML='<div class="successBox show">RMA request created: <b>'+ref+'</b></div>'}</script><footer><div class="footBrand"><a class="logo" href="index.html"><span>A</span><div>Aurelia<small>WOMEN'S ACCESSORIES</small></div></a></div><div><b>Support</b><a href="faq.html">FAQ</a><a href="policies.html">Policies</a></div></footer></body></html>
