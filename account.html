<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurelia | My Account</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><a class="logo" href="index.html"><span>A</span><div>Aurelia<small>MY ACCOUNT</small></div></a><nav><a href="index.html#shop">Shop</a><a href="wishlist.html">Wishlist</a><a href="cart.html">Cart</a><a href="admin.html">Admin</a></nav></header><main class="pageWrap"><p class="eyebrow">CUSTOMER CENTRE</p><h1>My Aurelia account</h1><div class="accountGrid"><section class="adminPanel"><h2>Profile</h2><form id="profile"><div class="formGrid"><label>Name<input id="name" required></label><label>Email<input id="email" type="email"></label><label>Phone<input id="phone"></label></div><button class="primary">Save profile</button></form><div id="profileMsg"></div></section><section class="adminPanel"><h2>Saved address</h2><form id="address"><div class="formGrid"><label class="full">Address<input id="addr"></label><label>City<input id="city"></label><label>State<input id="state"></label><label>Pincode<input id="pin" maxlength="6"></label></div><button class="secondary">Save address</button></form></section></div><section class="adminPanel" style="margin-top:16px"><h2>Orders</h2><div id="orders"></div></section><section class="adminPanel" style="margin-top:16px"><h2>Quick actions</h2><button class="secondary" onclick="location.href='wishlist.html'">Wishlist</button> <button class="secondary" onclick="location.href='compare.html'">Compare</button> <button class="secondary" onclick="location.href='track.html'">Track order</button> <button class="secondary" onclick="location.href='returns.html'">Return / warranty</button> <button class="secondary" onclick="mbExport('mb-orders','my-orders.json')">Export my orders</button> <button class="secondary" onclick="aureliaLogout()">Log out</button></section></main><footer><div class="footBrand"><a class="logo" href="index.html"><span>A</span><div>Aurelia<small>WOMEN'S ACCESSORIES</small></div></a></div></footer><script src="app.js"></script><script>const c=MB.get("mb-customer",{}),a=MB.get("mb-address",{});for(const [id,v] of Object.entries({name:c.name||"",email:c.email||"",phone:c.phone||"",addr:a.addr||"",city:a.city||"",state:a.state||"",pin:a.pin||""})){const e=document.getElementById(id);if(e)e.value=v}profile.onsubmit=e=>{e.preventDefault();MB.set("mb-customer",{name:name.value,email:email.value,phone:phone.value});profileMsg.innerHTML='<div class="successBox show">Profile saved on this device.</div>';mbNotify("Profile updated")};address.onsubmit=e=>{e.preventDefault();MB.set("mb-address",{addr:addr.value,city:city.value,state:state.value,pin:pin.value});alert("Address saved on this device.")};const os=MB.get("mb-orders",[]);orders.innerHTML=os.length?os.map(o=>'<div class="adminRow"><span><b>'+o.id+'</b><small>'+new Date(o.createdAt).toLocaleString("en-IN")+'</small></span><strong>₹'+Number(o.total||0).toLocaleString("en-IN")+'</strong><button class="secondary" onclick="mbGenerateInvoice('+JSON.stringify(o).replace(/"/g,"&quot;")+')">Invoice</button></div>').join(""):"No demo orders yet."; function aureliaLogout(){localStorage.removeItem("aurelia-session");location.href="login.html"}const s=JSON.parse(localStorage.getItem("aurelia-session")||"null");if(s?.type!=="customer"){location.replace("login.html")}else if(s.user){name.value=s.user.name||name.value;email.value=s.user.email||email.value}</script></body></html>
