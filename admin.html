<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurelia OS | Admin</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><a class="logo" href="index.html"><span>A</span><div>Aurelia<small>OS ADMIN</small></div></a><nav><a href="index.html">Store</a><a href="account.html">Customers</a></nav></header><main class="pageWrap"><p class="eyebrow">AURELIA OS</p><h1>Operations dashboard</h1><div class="dashGrid"><div class="stat"><small>Revenue</small><b id="dRevenue">₹0</b></div><div class="stat"><small>Orders</small><b id="dOrders">0</b></div><div class="stat"><small>Cart items</small><b id="dCart">0</b></div><div class="stat"><small>Wishlist items</small><b id="dWish">0</b></div></div><div class="adminGrid"><section class="adminPanel"><h2>Products</h2><input id="prodSearch" placeholder="Search SKU/name"><div id="productAdmin"></div></section><section class="adminPanel"><h2>Inventory alerts</h2><div id="stockAlerts"></div></section><section class="adminPanel"><h2>Customers</h2><div id="customerAdmin"></div><button class="secondary" onclick="exportCustomers()">Export customers</button></section><section class="adminPanel"><h2>Customer segments</h2><div class="segment">jewellery buyers <b id="segCctv">0</b></div><div class="segment">Networking buyers <b id="segNet">0</b></div><div class="segment">High-value carts <b id="segHigh">0</b></div><button class="primary" onclick="exportData()">Export store data</button><button class="secondary" onclick="mbExport(&quot;mb-orders&quot;,&quot;multibyte-orders.json&quot;)">Export orders</button><button class="secondary" onclick="mbExport(&quot;mb-wishlist&quot;,&quot;multibyte-wishlist.json&quot;)">Export wishlist</button><button class="secondary" onclick="mbClearDemoData()">Reset demo data</button></section></div></main><script src="app.js"></script><script>const session=JSON.parse(localStorage.getItem("aurelia-session")||"null");if(session?.type!=="admin"){location.replace("login.html")}const customers=JSON.parse(localStorage.getItem("aurelia-customers")||"[]");document.getElementById("customerAdmin").innerHTML=customers.length?customers.map(c=>'<div class="adminRow"><span><b>'+c.name+'</b><small>'+c.email+'</small></span><strong>'+c.id+'</strong></div>').join(""):"No customer accounts yet.";function exportCustomers(){const blob=new Blob([JSON.stringify(customers,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="aurelia-customers.json";a.click()}</script><script>const inv=products.map((p,i)=>({...p,stock:[4,18,7,26,11,33,3,2,20,14,5,9][i]||0}));const carts=JSON.parse(localStorage.getItem("mb-cart")||"[]");const wish=JSON.parse(localStorage.getItem("mb-wishlist")||"[]");document.getElementById("dCart").textContent=carts.length;document.getElementById("dWish").textContent=wish.length;document.getElementById("dOrders").textContent=localStorage.getItem("mb-orders")?JSON.parse(localStorage.getItem("mb-orders")).length:0;document.getElementById("dRevenue").textContent="₹"+Number(localStorage.getItem("ar-revenue")||0).toLocaleString("en-IN");document.getElementById("segCctv").textContent=wish.filter(id=>inv.find(p=>p.id==id)?.cat==="jewellery & Security").length;document.getElementById("segNet").textContent=wish.filter(id=>inv.find(p=>p.id==id)?.cat==="Networking").length;document.getElementById("segHigh").textContent=carts.length>=10?"1+":"0";function draw(){let q=document.getElementById("prodSearch").value.toLowerCase();document.getElementById("productAdmin").innerHTML=inv.filter(p=>p.name.toLowerCase().includes(q)).map(p=>'<div class="adminRow"><span><b>'+p.name+'</b><small>SKU MB-DEMO-'+p.id+'</small></span><strong>'+p.stock+'</strong><button onclick="adjust('+p.id+',-1)">−</button><button onclick="adjust('+p.id+',1)">+</button></div>').join("");document.getElementById("stockAlerts").innerHTML=inv.filter(p=>p.stock<=5).map(p=>'<div class="alertRow">⚠ '+p.name+' <b>'+p.stock+'</b></div>').join("")||"No low-stock alerts."}function adjust(id,n){let p=inv.find(x=>x.id===id);p.stock=Math.max(0,p.stock+n);draw()}function exportData(){const blob=new Blob([JSON.stringify({products:inv,cart:carts,wishlist:wish,orders:localStorage.getItem("mb-orders")||"[]"},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="multibyte-store-export.json";a.click()}document.getElementById("prodSearch").oninput=draw;draw();</script></body></html>
