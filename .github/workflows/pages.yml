name: Validate MultiByte website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check cart-page.js
      - name: Validate required pages
        run: |
          test -s index.html
          test -s cart.html
          test -s checkout.html
          test -s account.html
          test -s faq.html
          test -s policies.html
          test -s style.css
      - name: Validate ecommerce features
        run: |
          grep -q "WhatsApp" index.html
          grep -q "checkout" index.html
          grep -q "wishlist" app.js
          grep -q "localStorage" app.js
          grep -q "sitemap" robots.txt
